<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 490" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  
  <!-- ================= BALÃO 1 ================= -->
  <!-- Aparece no segundo 3 -->
  <g transform="translate(20, 20)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3s" fill="freeze" />
    <rect width="210" height="54" rx="20" fill="#2d3139"/>
    <text x="20" y="33" fill="#ffffff" font-size="18" font-weight="500">Hi, I'm Cristiano</text>
  </g>

  <!-- ================= BALÃO 2 ================= -->
  <!-- Aparece no segundo 6 -->
  <g transform="translate(20, 90)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="6s" fill="freeze" />
    <rect width="560" height="75" rx="20" fill="#2d3139"/>
    <text x="20" y="33" fill="#ffffff" font-size="18">Computer Science Student &amp; Researcher</text>
    <text x="20" y="58" fill="#ffffff" font-size="18">Focused on Cybersecurity, Network, Machine Learning &amp; AI</text>
  </g>

  <!-- ================= BALÃO 3 ================= -->
  <!-- Aparece no segundo 9 -->
  <g transform="translate(20, 180)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="9s" fill="freeze" />
    <rect width="530" height="54" rx="20" fill="#2d3139"/>
    <text x="20" y="33" fill="#ffffff" font-size="18">I love learning and contribution for community</text>
  </g>

  <!-- ================= BALÃO 4 ================= -->
  <!-- Aparece no segundo 12 -->
  <g transform="translate(20, 250)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="12s" fill="freeze" />
    <rect width="600" height="54" rx="20" fill="#2d3139"/>
    <text x="20" y="33" fill="#ffffff" font-size="18">Please reach out via email : <tspan fill="#58a6ff">criscristimarsilva@gmail.com</tspan></text>
  </g>

  <!-- ================= BALÃO 5 ================= -->
  <!-- Aparece no segundo 15 -->
  <g transform="translate(20, 320)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="15s" fill="freeze" />
    <rect width="770" height="54" rx="20" fill="#2d3139"/>
    <text x="20" y="33" fill="#ffffff" font-size="18">Follow me on LinkedIn : <tspan fill="#58a6ff">https://www.linkedin.com/in/cristiano-marques-silva-a62656391/</tspan></text>
  </g>

  <!-- ================= BALÃO DE DIGITANDO (Acompanha o fluxo) ================= -->
  <!-- 
    Ele começa visível (0s).
    Muda de posição (eixo Y) para descer conforme as mensagens aparecem.
    Sempre se move 0.1s antes da nova mensagem surgir e some de vez após o último balão.
  -->
  <g id="typing-bubble" transform="translate(20, 20)">
    <!-- Controle de Visibilidade: Some aos 15 segundos quando a última mensagem chega -->
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.99;1" dur="15.1s" fill="freeze" />
    
    <!-- Controle de Posição: Desce a cada 3 segundos -->
    <animateTransform attributeName="transform" type="translate" 
      values="20,20; 20,20; 20,90; 20,90; 20,180; 20,180; 20,250; 20,250; 20,320; 20,320" 
      keyTimes="0; 0.19; 0.20; 0.39; 0.40; 0.59; 0.60; 0.79; 0.80; 1" 
      dur="15s" fill="freeze" />

    <rect width="90" height="54" rx="20" fill="#2d3139"/>
    
    <!-- Pontinho 1 -->
    <circle cx="30" cy="27" r="4" fill="#ffffff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0s" repeatCount="indefinite" />
    </circle>
    
    <!-- Pontinho 2 -->
    <circle cx="45" cy="27" r="4" fill="#ffffff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0.2s" repeatCount="indefinite" />
    </circle>
    
    <!-- Pontinho 3 -->
    <circle cx="60" cy="27" r="4" fill="#ffffff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0.4s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
