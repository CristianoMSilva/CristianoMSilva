<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 150" width="100%" height="100%" style="background-color: #0d1117; font-family: 'Fira Code', Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace;">
  
  <!-- Estrutura da Janela do Terminal (Altura aumentada para 130) -->
  <rect x="10" y="10" width="800" height="130" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  
  <!-- Barra de Cabeçalho do Terminal -->
  <path d="M 10,22 A 12,12 0 0,1 22,10 L 798,10 A 12,12 0 0,1 810,22 L 810,40 L 10,40 Z" fill="#21262d"/>
  
  <!-- Botões estilo Mac/Linux -->
  <circle cx="32" cy="25" r="6" fill="#ff5f56" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.2s" fill="freeze" />
  </circle>
  <circle cx="52" cy="25" r="6" fill="#ffbd2e" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.4s" fill="freeze" />
  </circle>
  <circle cx="72" cy="25" r="6" fill="#27c93f" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.6s" fill="freeze" />
  </circle>
  
  <!-- Título do Terminal -->
  <text x="410" y="30" fill="#8b949e" font-size="13" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif">cristiano@github:~</text>

  <!-- Corpo do Terminal / Texto Animado com Fonte Maior (32px) -->
  <g transform="translate(35, 95)">
    <!-- Indicador de Terminal (Prompt) -->
    <text x="0" y="0" fill="#58a6ff" font-size="32" font-weight="bold">❯</text>
    
    <!-- Texto Sendo Digitado -->
    <text x="35" y="0" fill="#58a6ff" font-size="32" font-weight="bold" opacity="0">Welcome
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1s" fill="freeze"/>
    </text>
    
    <text x="180" y="0" fill="#ffffff" font-size="32" font-weight="bold" opacity="0">to
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1.4s" fill="freeze"/>
    </text>
    
    <text x="230" y="0" fill="#79c0ff" font-size="32" font-weight="bold" opacity="0">my
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1.7s" fill="freeze"/>
    </text>
    
    <text x="285" y="0" fill="#58a6ff" font-size="32" font-weight="bold" opacity="0">profile!
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="2.1s" fill="freeze"/>
    </text>
    
    <!-- Cursor Piscando (Ajustado para o novo tamanho e posições) -->
    <rect x="440" y="-28" width="16" height="34" fill="#58a6ff">
      <!-- Movimento do cursor acompanhando o texto maior -->
      <animate attributeName="x" values="35;170;220;275;440" keyTimes="0;0.35;0.53;0.66;1" dur="2.1s" fill="freeze"/>
      <!-- Efeito de piscar infinito -->
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="2.1s"/>
    </rect>
  </g>
</svg>
